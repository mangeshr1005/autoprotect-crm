<template>
    <lightning-card title="Advisor Performance Scorecard" icon-name="standard:metrics">
        <div class="slds-p-around_medium">
            <template if:true={scorecard}>
                <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-box slds-theme_shade">
                            <p class="slds-text-title_caps">Active Bound Policies</p>
                            <p class="slds-text-heading_large">{scorecard.boundPolicies}</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-box slds-theme_shade">
                            <p class="slds-text-title_caps">Collected Premium</p>
                            <p class="slds-text-heading_large"><lightning-formatted-number value={scorecard.totalPremiumCollected} format-style="currency"></lightning-formatted-number></p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-box slds-theme_success">
                            <p class="slds-text-title_caps">Earned Commission</p>
                            <p class="slds-text-heading_large"><lightning-formatted-number value={scorecard.earnedCommission} format-style="currency"></lightning-formatted-number></p>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
