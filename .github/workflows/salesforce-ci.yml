name: AutoProtect CRM CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Authenticate Salesforce Org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > ./sfdx_auth.txt
          sf org login sfdx-url --sfdx-url-file ./sfdx_auth.txt --alias target-org --set-default
          rm ./sfdx_auth.txt
      - name: Validate Metadata & Run Local Apex Tests
        if: github.event_name == 'pull_request'
        run: sf project deploy validate --source-dir force-app --test-level RunLocalTests --target-org target-org
      - name: Deploy to Target Org
        if: github.event_name != 'pull_request'
        run: sf project deploy start --source-dir force-app --test-level RunLocalTests --target-org target-org
